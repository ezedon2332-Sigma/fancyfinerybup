# Fancy Finery — production / staging stack.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Differs from docker-compose.yml (development) in ways that matter:
#   - the APP runs as a container here; in dev it runs on the host under
#     `next dev` so hot reload works
#   - nothing but Caddy publishes a port. Postgres, MinIO and Redis are
#     reachable only on the internal network, so the database is not exposed to
#     the internet by a stray firewall rule
#   - there is NO cloudflared service. Tunnels are a development tool and
#     scripts/tunnel.mjs refuses to run with APP_ENV=production anyway
#
# Every secret comes from the environment (a .env beside this file on the VPS).
# No default passwords: an unset value must fail loudly, not silently ship a
# known credential.

services:
  web:
    image: ${APP_IMAGE:-ghcr.io/OWNER/fancyfinery:latest}
    container_name: fancy-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?set APP_ENV to staging or production}
      # Service names, not localhost — these resolve on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_ASSET_BASE_URL: ${EMAIL_ASSET_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IP_HASH_SALT: ${IP_HASH_SALT:?}
      CRON_SECRET: ${CRON_SECRET:?}
      MEDIA_MAX_IMAGE_MB: ${MEDIA_MAX_IMAGE_MB:-25}
      MEDIA_MAX_VIDEO_MB: ${MEDIA_MAX_VIDEO_MB:-200}
      # Bootstrap admin — read by scripts/seed-admin.mjs during deploy seeding.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    container_name: fancy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Deliberately no `ports:` — the database is internal only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fancy-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fancy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: create the media bucket (public-read for product photos) and a
  # least-privilege service account for the app, then exit. Idempotent — safe to
  # re-run on every `up`. The app authenticates with S3_ACCESS_KEY_ID, never root.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p \"local/$$S3_BUCKET\" &&
      mc anonymous set download \"local/$$S3_BUCKET\" &&
      (mc admin user svcacct add --access-key \"$$S3_ACCESS_KEY_ID\" --secret-key \"$$S3_SECRET_ACCESS_KEY\" local \"$$MINIO_ROOT_USER\" || echo 'svcacct exists, skipping') &&
      echo 'minio-init done'
      "
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: fancy-caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Replaces the Vercel cron entries. Sends the bearer token the /api/cron/*
  # routes require, so the endpoints stay closed to anyone else.
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: fancy-cron
    restart: unless-stopped
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.newsletter.schedule: "0 0 9 * * *"
      ofelia.job-run.newsletter.image: "curlimages/curl:latest"
      ofelia.job-run.newsletter.network: "${COMPOSE_PROJECT_NAME:-fancyfinerybup}_default"
      ofelia.job-run.newsletter.command: >-
        -fsS -H "Authorization: Bearer ${CRON_SECRET}" http://web:3000/api/cron/newsletter
      ofelia.job-run.reconcile.schedule: "0 0 3 * * *"
      ofelia.job-run.reconcile.image: "curlimages/curl:latest"
      ofelia.job-run.reconcile.network: "${COMPOSE_PROJECT_NAME:-fancyfinerybup}_default"
      ofelia.job-run.reconcile.command: >-
        -fsS -H "Authorization: Bearer ${CRON_SECRET}" http://web:3000/api/cron/reconcile-payments

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
