name: Deploy

# Build once in CI, push to GHCR, deploy the exact tagged image over SSH.
#
# GitHub is the single source of truth for configuration:
#   - the whole runtime .env is stored as the secret STAGING_ENV / PRODUCTION_ENV
#     and rendered onto the box on every deploy. Add/change a variable in GitHub;
#     never edit the server.
#   - NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they come
#     from repo Variables (they are public, not secrets).
#
# Branch -> environment:  push `staging` -> staging,  push `main` -> production.
# PRs land on `dev` first and are promoted.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* come from repo Variables (public, baked into the client bundle).
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ github.ref_name == 'main' && vars.PROD_NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_URL=${{ github.ref_name == 'main' && vars.PROD_NEXT_PUBLIC_MEDIA_URL || vars.NEXT_PUBLIC_MEDIA_URL }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ github.ref_name == 'main' && vars.PROD_NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY || vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target dir
        id: t
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/opt/fancy/production" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/fancy/staging" >> "$GITHUB_OUTPUT"
          fi

      # Production has no host/config yet (staging-first phase). Skip the deploy
      # steps cleanly on main until PRODUCTION_ENV is set, instead of failing.
      - name: Gate production until configured
        id: guard
        env:
          PROD_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ -z "$PROD_ENV" ]; then
            echo "PRODUCTION_ENV not set — production not provisioned yet. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Render the whole .env from the GitHub secret for this environment.
      - name: Render env (staging)
        if: github.ref_name != 'main'
        env:
          BLOB: ${{ secrets.STAGING_ENV }}
        run: printf '%s' "$BLOB" > env.rendered
      - name: Render env (production)
        if: github.ref_name == 'main' && steps.guard.outputs.skip != 'true'
        env:
          BLOB: ${{ secrets.PRODUCTION_ENV }}
        run: printf '%s' "$BLOB" > env.rendered

      - name: Ship .env + compose + Caddyfile
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && vars.PROD_VPS_HOST || vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "env.rendered,docker-compose.prod.yml,Caddyfile"
          target: ${{ steps.t.outputs.dir }}

      - name: Deploy over SSH
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && vars.PROD_VPS_HOST || vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd ${{ steps.t.outputs.dir }}
            mv -f env.rendered .env && chmod 600 .env

            IMG="$(echo '${{ env.IMAGE_NAME }}' | tr 'A-Z' 'a-z')"
            export APP_IMAGE="${{ env.REGISTRY }}/$IMG:sha-${GITHUB_SHA::7}"
            echo "Deploying $APP_IMAGE"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull web

            docker compose -f docker-compose.prod.yml run --rm --entrypoint "node scripts/db-migrate.mjs" web

            # Seed: staging gets demo catalogue + admin; production gets admin only
            # (db-seed.mjs skips the catalogue when APP_ENV=production). Idempotent.
            docker compose -f docker-compose.prod.yml run --rm --entrypoint "node scripts/db-seed.mjs" web

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f --filter "until=168h"

      - name: Verify the site answers
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && vars.PROD_VPS_HOST || vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            for i in $(seq 1 40); do
              if docker exec fancy-web node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Healthy after ${i} tries"; exit 0
              fi
              sleep 2
            done
            echo "Not healthy — docker compose -f docker-compose.prod.yml logs web"; exit 1
