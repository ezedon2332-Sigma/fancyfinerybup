name: Deploy

# Build once, deploy the exact artifact that was built.
#
# The image is built in CI and pushed to GHCR; the VPS only ever pulls a tagged
# image. It deliberately does NOT build on the server: a build there competes
# with the running site for CPU, and "works on the box that built it" is how
# environments drift apart.

# NOTE: automatic deploy on push is DISABLED until the VPS exists.
#
# The workflow is complete and correct, but there is nowhere to deploy to yet:
# VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_APP_DIR are unset, so every push would
# build an image and then fail at the SSH step. Re-enable by uncommenting the
# `push:` trigger once the server and those secrets are in place.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # Never let two deploys race onto the same host. `cancel-in-progress: false`
  # because cancelling mid-deploy could leave migrations applied and the old
  # image still serving.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Gate: never deploy something that does not compile --------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the clean-architecture layer rules)
        run: npm run lint

  # --- Build and publish the image ------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A commit-SHA tag as well as `latest`, so a rollback is
          # `APP_IMAGE=...:sha-abc1234 docker compose up -d` and nothing else.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so
          # they have to be supplied here rather than at run time. They are not
          # secrets — they ship to every browser regardless.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.NEXT_PUBLIC_MEDIA_URL }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  # --- Ship it ---------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}

            # The compose file, Caddyfile and .env live on the server and are
            # not in the image — .env holds the secrets and must never be baked
            # into a layer anyone who can pull the image could read.
            git pull --ff-only

            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
            echo "Deploying $APP_IMAGE"

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull web

            # Migrations run BEFORE the new image starts serving, in a one-shot
            # container built from that same image. Running them from the image
            # guarantees the SQL and the code that expects it are the same
            # build. `--rm` so a failure leaves nothing behind, and script_stop
            # aborts the deploy rather than starting an app against a schema it
            # cannot use.
            docker compose -f docker-compose.prod.yml run --rm \
              --entrypoint "node scripts/db-migrate.mjs" web

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Old images accumulate fast with per-commit tags.
            docker image prune -f --filter "until=168h"

      - name: Verify the site answers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            # Give the container its start_period, then prove it serves rather
            # than trusting that `up -d` returning 0 means healthy.
            for i in $(seq 1 30); do
              if docker exec fancy-web node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Healthy after ${i}s"; exit 0
              fi
              sleep 1
            done
            echo "Site did not become healthy — check: docker compose -f docker-compose.prod.yml logs web"
            exit 1
